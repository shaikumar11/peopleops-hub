<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Request flow: submit, rules check, approval, ledger, telemetry">
<style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle}.b{fill:#eef4fb;stroke:#1F4E79;stroke-width:2}.h{font-size:16px;font-weight:700;fill:#1F4E79}
.n{font-size:12px;fill:#44566c}.k{font-size:13px;fill:#1F4E79;text-anchor:start}.a{stroke:#1F4E79;stroke-width:2;stroke-dasharray:6 5;animation:d 1.5s linear infinite}
@keyframes d{to{stroke-dashoffset:-22}}</style>
<line class="a" x1="160" y1="95" x2="200" y2="95"/><line class="a" x1="340" y1="95" x2="380" y2="95"/><line class="a" x1="520" y1="95" x2="560" y2="95"/><line class="a" x1="700" y1="95" x2="740" y2="95"/>
<rect class="b" x="20" y="55" width="140" height="80" rx="12"/><text class="h" x="90" y="88">1 Submit</text><text class="n" x="90" y="110">leave or expense</text>
<rect class="b" x="200" y="55" width="140" height="80" rx="12"/><text class="h" x="270" y="88">2 Rules check</text><text class="n" x="270" y="110">limits and balance</text>
<rect class="b" x="380" y="55" width="140" height="80" rx="12"/><text class="h" x="450" y="88">3 Approval</text><text class="n" x="450" y="110">auto or manager</text>
<rect class="b" x="560" y="55" width="140" height="80" rx="12"/><text class="h" x="630" y="88">4 Ledger</text><text class="n" x="630" y="110">summary totals</text>
<rect class="b" x="740" y="55" width="140" height="80" rx="12"/><text class="h" x="810" y="88">5 Telemetry</text><text class="n" x="810" y="110">p95 per route</text>
<circle cx="20" cy="95" r="7" fill="#15803d"><animate attributeName="cx" from="20" to="880" dur="6s" repeatCount="indefinite"/></circle>
<text class="k" x="40" y="178">Leave up to 2 days and expenses up to 1,000 rupees are approved automatically</text>
<text class="k" x="40" y="202">Nobody can approve their own request, and a decision can only be made once</text>
<text class="k" x="40" y="226">Leave is capped at 20 days and the balance is checked again at approval</text>
</svg>
